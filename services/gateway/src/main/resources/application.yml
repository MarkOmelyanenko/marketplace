# Rate limiting (per client IP or X-Forwarded-For)
rate-limit:
  enabled: true
  requests-per-minute: 100
  capacity: 100

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # CORS: allow frontends (Partner Portal, Buyer Portal, Ops Dashboard)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:3002"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      # Gateway Server WebMvc reads routes from server.webmvc.routes (not gateway.routes)
      server:
        webmvc:
          routes:
            # StripPrefix=2: /api/offers/v1/offers -> /v1/offers (backend expects /v1/offers)
            - id: offers
              uri: http://localhost:8081
              predicates:
                - Path=/api/offers/**
              filters:
                - StripPrefix=2
            - id: payments
              uri: http://localhost:8082
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=2
            - id: ops-refund-requests
              uri: http://localhost:8085
              predicates:
                - Path=/api/ops/refund-requests,/api/ops/refund-requests/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/ops/refund-requests(?<segment>.*)
                    replacement: /internal/refund-requests${segment}
            - id: ops
              uri: http://localhost:8082
              predicates:
                - Path=/api/ops/**
              filters:
                - name: RewritePath
                  args:
                    regexp: /api/ops/(?<segment>.*)
                    replacement: /internal/${segment}
            - id: orders
              uri: http://localhost:8085
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=2
            - id: catalog
              uri: http://localhost:8081
              predicates:
                - Path=/api/catalog/**
              filters:
                - StripPrefix=2

server:
  port: 8080
