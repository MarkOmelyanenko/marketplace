server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

payments:
  webhook-url: ${PAYMENTS_WEBHOOK_URL:http://localhost:8082/v1/webhooks/provider}
  webhook-secret: ${PROVIDER_WEBHOOK_SECRET:dev-secret}
