# Один файл — інфра + всі бекенди + фронтенди. Запуск: docker compose -f docker-compose.full.yml up -d --build

services:
  postgres:
    image: postgres:16
    container_name: pet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 100m
    networks:
      - pet-network

  kafka:
    image: apache/kafka:latest
    container_name: pet-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_HEAP_OPTS=-Xmx256m -Xms192m
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cd /opt/kafka/bin && ./kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 45s
    mem_limit: 320m
    networks:
      - pet-network

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    container_name: pet-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pet-postgres:5432/postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=pet-kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - pet-network

  offer-service:
    build:
      context: ../services/offer-service
      dockerfile: Dockerfile
    container_name: pet-offer-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pet-postgres:5432/offer_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=pet-kafka:9092
      - PAYMENT_SERVICE_URL=http://payments-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - pet-network

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile
    container_name: pet-payments-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pet-postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=pet-kafka:9092
      - PROVIDER_BASE_URL=http://provider-simulator:8084
      - PROVIDER_WEBHOOK_SECRET=dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 256m
    networks:
      - pet-network

  enrichment-service:
    build:
      context: ../services/enrichment-service
      dockerfile: Dockerfile
    container_name: pet-enrichment-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=pet-kafka:9092
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 220m
    networks:
      - pet-network

  provider-simulator:
    build:
      context: ../services/provider-simulator
      dockerfile: Dockerfile
    container_name: pet-provider-simulator
    ports:
      - "8084:8084"
    environment:
      - PAYMENTS_WEBHOOK_URL=http://payments-service:8082/v1/webhooks/provider
      - PROVIDER_WEBHOOK_SECRET=dev-secret
    depends_on:
      - payments-service
    mem_limit: 220m
    networks:
      - pet-network

  orders-service:
    build:
      context: ../services/orders-service
      dockerfile: Dockerfile
    container_name: pet-orders-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pet-postgres:5432/order_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=pet-kafka:9092
      - OFFER_SERVICE_URL=http://offer-service:8081
      - PAYMENT_SERVICE_URL=http://payments-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      offer-service:
        condition: service_started
      payments-service:
        condition: service_started
    mem_limit: 256m
    networks:
      - pet-network

  landing:
    build:
      context: ../frontends/landing
      dockerfile: Dockerfile
    container_name: pet-landing
    ports:
      - "80:80"
    mem_limit: 32m
    networks:
      - pet-network

  partner-portal:
    build:
      context: ../frontends
      dockerfile: partner-portal/Dockerfile
    container_name: pet-partner-portal
    ports:
      - "3000:80"
    depends_on:
      - gateway
    mem_limit: 48m
    networks:
      - pet-network

  ops-dashboard:
    build:
      context: ../frontends
      dockerfile: ops-dashboard/Dockerfile
    container_name: pet-ops-dashboard
    ports:
      - "3001:80"
    depends_on:
      - gateway
    mem_limit: 48m
    networks:
      - pet-network

  buyer-portal:
    build:
      context: ../frontends
      dockerfile: buyer-portal/Dockerfile
      args:
        # На GCP задайте GATEWAY_PUBLIC_URL=http://EXTERNAL_IP:8080 перед build
        VITE_API_BASE_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
    container_name: pet-buyer-portal
    ports:
      - "3002:80"
    depends_on:
      - gateway
    mem_limit: 48m
    networks:
      - pet-network

networks:
  pet-network:
    driver: bridge
